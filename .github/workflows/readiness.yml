name: Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to assess (leave empty to run checks only)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: readiness-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Each check records its outcome but never stops the job, so the
      # readiness report is always produced.
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Tests
        id: test
        continue-on-error: true
        run: npm test

      - name: Readiness assessment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          CHECKS: >-
            {"typecheck":"${{ steps.typecheck.outcome }}","build":"${{ steps.build.outcome }}","tests":"${{ steps.test.outcome }}"}
        run: node scripts/readiness.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-result
          path: readiness.json
